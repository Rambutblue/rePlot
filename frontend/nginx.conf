fastcgi_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:50m max_size=2g inactive=7d use_temp_path=off;

types {
    text/javascript mjs;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/vnd.mapbox-vector-tile;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass php:9000;

        fastcgi_cache api;
        fastcgi_cache_key $request_uri;
        fastcgi_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
